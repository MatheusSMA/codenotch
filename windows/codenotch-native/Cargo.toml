[package]
name = "codenotch-native"
version = "0.1.0"
edition = "2021"
description = "Codenotch notch drawn into a layered Win32 window, with no WebView"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }
resvg = { version = "0.48.1", default-features = false }
ab_glyph = "0.2.32"
tiny_http = "0.12"

[dev-dependencies]
# Only for the ported hook-server tests, which POST at the real socket rather than mocking it.
ureq = "2"

[[bin]]
name = "codenotch-native"
path = "src/main.rs"
