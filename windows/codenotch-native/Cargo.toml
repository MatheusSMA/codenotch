[package]
name = "codenotch-native"
version = "0.1.0"
edition = "2021"
description = "Codenotch notch drawn into a layered Win32 window, with no WebView"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }
resvg = { version = "0.48.1", default-features = false }
ab_glyph = "0.2.32"
tiny_http = "0.12"
# The usage fetcher talks to api.anthropic.com. native-tls for the same reason upstream gives:
# the Antigravity bridge's self-signed certificate, accepted for loopback only.
ureq = { version = "2", features = ["json", "native-tls"] }
native-tls = "0.2"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }

[[bin]]
name = "codenotch-native"
path = "src/main.rs"
