[package]
name = "codenotch-daemon"
version = "0.1.0"
edition = "2021"
description = "Codenotch without a window: the hook server and the usage fetchers, for desktops that draw the pill themselves (the GNOME Shell extension)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tiny_http = "0.12"
ureq = { version = "2", features = ["json", "native-tls"] }
native-tls = "0.2"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_Credentials",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_Globalization",
  "Win32_System_Console",
  "Win32_System_Registry",
] }
